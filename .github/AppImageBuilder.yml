# Recette appimage-builder : embarque Ruby, GTK3 et WebKitGTK (Ubuntu 24.04) + l'app et ses gems.
# AppDir/usr/src/cavavin est préparé par .github/workflows/release.yml avant l'appel.
version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: org.example.cavavin
    name: Cavavin
    icon: cavavin
    version: !ENV ${VERSION}
    exec: usr/bin/ruby3.2
    exec_args: $APPDIR/usr/src/cavavin/app.rb $@

  apt:
    arch: amd64
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble main universe
        key_url: http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble-updates main universe
    include:
      - ruby3.2
      - ruby-bundler
      - libgtk-3-0t64
      - libwebkit2gtk-4.1-0
      - gir1.2-gtk-3.0
      - gir1.2-webkit2-4.1
      - libgirepository-1.0-1
      - libgirepository-2.0-0
      - libgdk-pixbuf2.0-bin
      - libglib2.0-bin
      - librsvg2-common

  files:
    exclude:
      - usr/share/man
      - usr/share/doc

  runtime:
    env:
      BUNDLE_GEMFILE: $APPDIR/usr/src/cavavin/Gemfile
      BUNDLE_FROZEN: "true"
      GI_TYPELIB_PATH: $APPDIR/usr/lib/x86_64-linux-gnu/girepository-1.0
      # la page affichée vient de notre propre serveur local ; le sandbox bubblewrap de WebKit
      # ne voit pas les fichiers montés de l'AppImage et empêcherait le rendu
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
    # chemins compilés en dur dans ruby et libwebkit2gtk, redirigés vers l'AppImage
    path_mappings:
      - /usr/lib/ruby:$APPDIR/usr/lib/ruby
      - /usr/lib/x86_64-linux-gnu/ruby:$APPDIR/usr/lib/x86_64-linux-gnu/ruby
      - /usr/share/rubygems-integration:$APPDIR/usr/share/rubygems-integration
      - /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:$APPDIR/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1

AppImage:
  arch: x86_64
  file_name: Cavavin-x86_64.AppImage
